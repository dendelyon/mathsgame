<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maths Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #8fd3ff; --bg2: #c9b6ff;
    --card: #ffffff; --ink: #2d2a4a;
    --add: #ff8a5b; --sub: #4fc3a1; --mul: #b07cff; --div: #ffc23d;
    --good: #3ccf7a; --bad: #ff5d73;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: 'Baloo 2', 'Comic Sans MS', sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    display: flex; align-items: center; justify-content: center;
    padding: 16px; overflow-x: hidden;
  }
  .card {
    background: var(--card); border-radius: 32px;
    box-shadow: 0 12px 0 rgba(45,42,74,.15), 0 20px 40px rgba(45,42,74,.2);
    width: 100%; max-width: 560px; padding: 28px 24px; text-align: center;
  }
  h1 { font-size: 2.4rem; margin: 0 0 4px; line-height: 1.1; }
  h2 { font-size: 1.4rem; margin: 20px 0 10px; }
  .sub { margin: 0; opacity: .7; font-size: 1.1rem; }
  .hidden { display: none !important; }

  /* Slider */
  .time-display { font-size: 2rem; font-weight: 800; color: #6a5acd; }
  input[type=range] { width: 100%; height: 18px; -webkit-appearance: none; appearance: none;
    background: #e8e4ff; border-radius: 10px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 40px; height: 40px;
    border-radius: 50%; background: #6a5acd; border: 5px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,.3); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 32px; height: 32px; border-radius: 50%;
    background: #6a5acd; border: 5px solid #fff; cursor: pointer; }
  .range-labels { display: flex; justify-content: space-between; font-size: .95rem; opacity: .6; }

  /* Operation boxes */
  .ops { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .op {
    border: 5px solid transparent; border-radius: 24px; padding: 14px 8px;
    font-family: inherit; font-size: 1.1rem; font-weight: 700; color: #fff; cursor: pointer;
    opacity: .45; transform: scale(.96); transition: all .15s;
    box-shadow: 0 6px 0 rgba(0,0,0,.15);
  }
  .op .sym { display: block; font-size: 2.8rem; line-height: 1; }
  .op.on { opacity: 1; transform: scale(1); border-color: var(--ink); }
  .op.on::after { content: ' ✓'; }
  .op[data-op="+"] { background: var(--add); }
  .op[data-op="-"] { background: var(--sub); }
  .op[data-op="×"] { background: var(--mul); }
  .op[data-op="÷"] { background: var(--div); }
  .hint { min-height: 1.5em; color: var(--bad); font-weight: 700; margin: 10px 0 0; }

  .big-btn {
    margin-top: 18px; width: 100%; padding: 16px; border: none; border-radius: 22px;
    font-family: inherit; font-size: 1.7rem; font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #5ee08f, #2fb866); box-shadow: 0 7px 0 #1f8a4a;
    transition: transform .1s;
  }
  .big-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #1f8a4a; }

  /* Game screen */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 800; font-size: 1.2rem; }
  .timer { font-size: 2rem; color: #6a5acd; }
  .timer.low { color: var(--bad); animation: pulse .6s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.12); } }
  .bar { height: 16px; background: #eee; border-radius: 10px; overflow: hidden; margin: 8px 0 18px; }
  .bar > div { height: 100%; width: 100%; background: linear-gradient(90deg, #6a5acd, #9d8cff); transition: width 1s linear; }
  .bar > div.low { background: linear-gradient(90deg, #ff5d73, #ff9a8b); }
  .question { font-size: 3.6rem; font-weight: 800; margin: 10px 0 20px; }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .ans {
    border: none; border-radius: 22px; padding: 18px 8px; font-family: inherit;
    font-size: 2.2rem; font-weight: 800; color: var(--ink); cursor: pointer;
    background: #f1eeff; box-shadow: 0 6px 0 #cfc7f5; transition: transform .1s;
  }
  .ans:active { transform: translateY(4px); box-shadow: 0 2px 0 #cfc7f5; }
  .ans.right { background: var(--good); color: #fff; box-shadow: 0 6px 0 #229c55; }
  .ans.wrong { background: var(--bad); color: #fff; box-shadow: 0 6px 0 #c63b4f; }
  .feedback { min-height: 2em; font-size: 1.5rem; font-weight: 800; margin-top: 14px; }
  .dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: #e3e0f5; }
  .dot.right { background: var(--good); } .dot.wrong { background: var(--bad); } .dot.now { outline: 3px solid #6a5acd; }

  /* Results */
  .score { font-size: 4rem; font-weight: 800; color: #6a5acd; margin: 6px 0; }
  .stars { font-size: 3rem; letter-spacing: 6px; }
  .review { text-align: left; margin-top: 16px; max-height: 260px; overflow-y: auto; }
  .review div { padding: 8px 12px; border-radius: 12px; margin-bottom: 6px; font-size: 1.15rem; font-weight: 700; }
  .review .r { background: #e3f9ec; } .review .w { background: #ffe6ea; } .review .s { background: #f0f0f0; color: #777; }
  .timesup { font-size: 1.4rem; font-weight: 800; color: var(--bad); }

  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  @media (max-width: 420px) {
    h1 { font-size: 2rem; } .question { font-size: 2.8rem; } .ans { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<!-- START SCREEN -->
<div class="card" id="start">
  <h1>🦄 Maths Adventure 🚀</h1>
  <p class="sub">Answer 10 questions before the timer runs out!</p>

  <h2>⏰ How much time?</h2>
  <div class="time-display" id="timeLabel">1 min</div>
  <input type="range" id="timeSlider" min="30" max="180" step="10" value="60">
  <div class="range-labels"><span>30 sec</span><span>3 min</span></div>

  <h2>🎯 Pick your maths!</h2>
  <div class="ops">
    <button class="op on" data-op="+"><span class="sym">+</span>Adding</button>
    <button class="op" data-op="-"><span class="sym">−</span>Taking away</button>
    <button class="op" data-op="×"><span class="sym">×</span>Times</button>
    <button class="op" data-op="÷"><span class="sym">÷</span>Sharing</button>
  </div>
  <p class="hint" id="hint"></p>

  <button class="big-btn" id="goBtn">Let's Go! 🎉</button>
</div>

<!-- GAME SCREEN -->
<div class="card hidden" id="game">
  <div class="topbar">
    <span>Question <span id="qNum">1</span>/10</span>
    <span class="timer" id="timer">1:00</span>
  </div>
  <div class="bar"><div id="timeBar"></div></div>
  <div class="question" id="question">2 + 3 = ?</div>
  <div class="answers" id="answers"></div>
  <div class="feedback" id="feedback"></div>
  <div class="dots" id="dots"></div>
</div>

<!-- RESULTS SCREEN -->
<div class="card hidden" id="results">
  <div class="timesup hidden" id="timesUp">⏰ Time's up!</div>
  <h1 id="resultTitle">Great job!</h1>
  <div class="score" id="score">0/10</div>
  <div class="stars" id="stars"></div>
  <div class="review" id="review"></div>
  <button class="big-btn" id="againBtn">Play Again 🔁</button>
</div>

<script>
  const TOTAL = 10;
  const $ = id => document.getElementById(id);
  let totalTime = 60, timeLeft = 60, timerId = null;
  let questions = [], current = 0, results = [], locked = false, finished = false;

  // ----- Start screen -----
  function fmt(s) {
    const m = Math.floor(s / 60), r = s % 60;
    return m + ':' + String(r).padStart(2, '0');
  }
  function sliderLabel(s) {
    const m = Math.floor(s / 60), r = s % 60;
    if (m === 0) return r + ' sec';
    return m + ' min' + (r ? ' ' + r + ' sec' : '');
  }
  $('timeSlider').addEventListener('input', e => {
    $('timeLabel').textContent = sliderLabel(+e.target.value);
  });
  document.querySelectorAll('.op').forEach(b => b.addEventListener('click', () => {
    b.classList.toggle('on'); $('hint').textContent = '';
  }));

  const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;

  function makeQuestion(op) {
    let a, b, ans;
    if (op === '+') { a = rand(1, 20); b = rand(1, 20); ans = a + b; }
    else if (op === '-') { a = rand(2, 20); b = rand(1, a); ans = a - b; }
    else if (op === '×') { a = rand(1, 10); b = rand(1, 10); ans = a * b; }
    else { b = rand(1, 10); ans = rand(1, 10); a = b * ans; }
    return { text: `${a} ${op === '-' ? '−' : op} ${b}`, ans, choices: makeChoices(ans) };
  }
  function makeChoices(ans) {
    const set = new Set([ans]);
    const offsets = [-3, -2, -1, 1, 2, 3, 4, -4, 5, 10, -10];
    while (set.size < 4) {
      const c = ans + offsets[rand(0, offsets.length - 1)];
      if (c >= 0) set.add(c);
    }
    return [...set].sort(() => Math.random() - .5);
  }

  $('goBtn').addEventListener('click', () => {
    const ops = [...document.querySelectorAll('.op.on')].map(b => b.dataset.op);
    if (!ops.length) { $('hint').textContent = 'Pick at least one! 👆'; return; }
    totalTime = timeLeft = +$('timeSlider').value;
    // spread the chosen operations evenly across the 10 questions
    const list = [];
    for (let i = 0; i < TOTAL; i++) list.push(ops[i % ops.length]);
    list.sort(() => Math.random() - .5);
    questions = list.map(makeQuestion);
    current = 0; results = []; finished = false;
    show('game'); buildDots(); renderQuestion(); startTimer();
  });

  // ----- Game -----
  function show(id) {
    ['start', 'game', 'results'].forEach(s => $(s).classList.toggle('hidden', s !== id));
  }
  function buildDots() {
    $('dots').innerHTML = '';
    for (let i = 0; i < TOTAL; i++) { const d = document.createElement('div'); d.className = 'dot'; $('dots').appendChild(d); }
  }
  function updateDots() {
    [...$('dots').children].forEach((d, i) => {
      d.className = 'dot' + (results[i] ? (results[i].correct ? ' right' : ' wrong') : '') + (i === current ? ' now' : '');
    });
  }
  function renderQuestion() {
    locked = false;
    const q = questions[current];
    $('qNum').textContent = current + 1;
    $('question').textContent = q.text + ' = ?';
    $('feedback').textContent = '';
    $('answers').innerHTML = '';
    q.choices.forEach(c => {
      const b = document.createElement('button');
      b.className = 'ans'; b.textContent = c;
      b.onclick = () => choose(b, c);
      $('answers').appendChild(b);
    });
    updateDots();
  }
  const cheers = ['Awesome! 🌟', 'You got it! 🎉', 'Super! 🦄', 'Brilliant! 🚀', 'Yay! 🌈', 'Amazing! 💖'];
  function choose(btn, val) {
    if (locked || finished) return;
    locked = true;
    const q = questions[current];
    const correct = val === q.ans;
    results[current] = { q, given: val, correct };
    if (correct) {
      btn.classList.add('right');
      $('feedback').textContent = cheers[rand(0, cheers.length - 1)];
    } else {
      btn.classList.add('wrong');
      [...$('answers').children].forEach(b => { if (+b.textContent === q.ans) b.classList.add('right'); });
      $('feedback').textContent = `Nice try! It was ${q.ans} 💪`;
    }
    updateDots();
    setTimeout(() => {
      if (finished) return;
      current++;
      if (current >= TOTAL) endGame(false); else renderQuestion();
    }, correct ? 800 : 1500);
  }

  function startTimer() {
    clearInterval(timerId);
    paintTimer();
    timerId = setInterval(() => {
      timeLeft--;
      paintTimer();
      if (timeLeft <= 0) endGame(true);
    }, 1000);
  }
  function paintTimer() {
    $('timer').textContent = fmt(Math.max(timeLeft, 0));
    const low = timeLeft <= 10;
    $('timer').classList.toggle('low', low);
    $('timeBar').classList.toggle('low', low);
    $('timeBar').style.width = (Math.max(timeLeft, 0) / totalTime * 100) + '%';
  }

  // ----- Results -----
  function endGame(timedOut) {
    if (finished) return;
    finished = true;
    clearInterval(timerId);
    const score = results.filter(r => r && r.correct).length;
    $('timesUp').classList.toggle('hidden', !timedOut);
    $('score').textContent = `${score}/${TOTAL}`;
    const starCount = score >= 9 ? 3 : score >= 6 ? 2 : score >= 3 ? 1 : 0;
    $('stars').textContent = '⭐'.repeat(starCount) + '☆'.repeat(3 - starCount);
    $('resultTitle').textContent =
      score === 10 ? 'PERFECT! You\'re a maths star! 🏆' :
      score >= 7 ? 'Fantastic work! 🎉' :
      score >= 4 ? 'Great effort! 💪' : 'Good try! Keep practising! 🌈';

    $('review').innerHTML = '';
    questions.forEach((q, i) => {
      const r = results[i], d = document.createElement('div');
      if (!r) { d.className = 's'; d.textContent = `⏳ ${q.text} = ${q.ans} (no time)`; }
      else if (r.correct) { d.className = 'r'; d.textContent = `✅ ${q.text} = ${q.ans}`; }
      else { d.className = 'w'; d.textContent = `❌ ${q.text} = ${q.ans} (you said ${r.given})`; }
      $('review').appendChild(d);
    });
    show('results');
    if (score >= 7) confetti();
  }
  function confetti() {
    const colors = ['#ff8a5b', '#4fc3a1', '#b07cff', '#ffc23d', '#ff5d73', '#5ec8ff'];
    for (let i = 0; i < 80; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (2 + Math.random() * 2) + 's';
      c.style.animationDelay = Math.random() * .8 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }
  }
  $('againBtn').addEventListener('click', () => show('start'));
</script>
</body>
</html>
